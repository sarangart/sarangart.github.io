<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; }
        #dashboard { margin: 20px; padding: 20px; border: 1px solid #ccc; }
        .city { margin-bottom: 20px; }
        .weather-info { margin-top: 20px; }
    </style>
</head>
<body>
    <div id="dashboard">
        <h1>Weather Dashboard</h1>
        <div class="city">
            <input id="city-input" type="text" placeholder="Enter city name" />
            <button id="search-btn">Search</button>
            <button id="toggle-units">Toggle Units</button>
        </div>
        <div class="weather-info" id="weather-info">
            <!-- Weather data will display here -->
        </div>
    </div>
    <script>
        const apiKey = 'YOUR_OPENWEATHERMAP_API_KEY';
        let isCelsius = true;
        const savedCities = JSON.parse(localStorage.getItem('savedCities')) || [];

        document.getElementById('search-btn').addEventListener('click', function() {
            const city = document.getElementById('city-input').value;
            if (city) {
                fetchWeatherData(city);
                saveCity(city);
            }
        });

        document.getElementById('toggle-units').addEventListener('click', function() {
            isCelsius = !isCelsius;
            // After toggle, you may want to refetch the current weather info for displayed city
        });

        function fetchWeatherData(city) {
            const units = isCelsius ? 'metric' : 'imperial';
            fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&units=${units}&appid=${apiKey}`)
                .then(response => response.json())
                .then(data => displayWeather(data));
        }

        function displayWeather(data) {
            const weatherInfo = document.getElementById('weather-info');
            weatherInfo.innerHTML = `<h2>${data.name}, ${data.sys.country}</h2>` +
                `<p>Temperature: ${data.main.temp} °${isCelsius ? 'C' : 'F'}</p>` +
                `<p>Weather: ${data.weather[0].description}</p>` +
                `<p>Humidity: ${data.main.humidity}%</p>` +
                `<p>Wind Speed: ${data.wind.speed} m/s</p>`;
        }

        function saveCity(city) {
            if (!savedCities.includes(city)) {
                savedCities.push(city);
                localStorage.setItem('savedCities', JSON.stringify(savedCities));
            }
        }
    </script>
</body>
</html>
